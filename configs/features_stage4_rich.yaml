random_seed: 17
analysis_rate_hz: 50
audio_sample_rate_hz: 16000
output_dir: outputs/stage4_revision/features_rich
features:
  log_mel:
    enabled: true
    family: acoustic
    n_mels: 40
    n_fft: 400
    hop_length: 320
    center: false
  envelope:
    enabled: true
    family: acoustic
  rich_acoustic:
    enabled: true
    family: acoustic
    temporal_derivatives:
      orders: [1, 2]
      method: finite_difference
    spectral_descriptors:
      spectral_flux_onset_strength: true
      centroid: true
      bandwidth: true
      rolloff: true
      roll_percent: 0.85
      zero_crossing_rate: true
  prosody:
    enabled: true
    family: prosodic
    f0_min_hz: 60
    f0_max_hz: 500
    note: inherited_once_from_base_schema_no_rich_feature_duplication
  recording_onset:
    enabled: true
    family: onset
  phones:
    enabled: true
    family: phonetic
    categories: global_union_across_manifest
  words:
    enabled: true
    family: word
  optional:
    phoneme_sequence_statistics: {enabled: false, status: unavailable_without_resource}
    word_frequency: {enabled: false, status: unavailable_without_resource}
    lexical_surprisal: {enabled: false, status: unavailable_without_resource}
    contextual_text_embeddings: {enabled: false, status: unavailable_without_resource}
