[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-trf-replication"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "scikit-learn>=1.3,<2",
    "h5py>=3.10,<4",
    "librosa>=0.10.2,<0.12",
    "soundfile>=0.12,<1",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.4"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
